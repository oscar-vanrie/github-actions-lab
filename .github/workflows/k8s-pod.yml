name: Kubernetes Pod

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - name: Apply pod with random name
        shell: powershell
        run: |
          $id = Get-Random -Minimum 10000 -Maximum 99999
          (Get-Content k8s/pod.yaml) -replace '\{ID\}', $id | kubectl apply -f -

      - name: List pods
        shell: powershell
        run: kubectl get pods -n demo
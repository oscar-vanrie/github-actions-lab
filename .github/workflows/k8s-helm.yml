name: Helm Deploy

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - name: Helm upgrade --install
        shell: powershell
        run: |
          helm upgrade --install whoami ./whoami-chart `
            --namespace demo --create-namespace `
            --set image.tag=v1.12.0 `
            --wait

      - name: Show result
        shell: powershell
        run: kubectl get deployment,svc,pods -n demo